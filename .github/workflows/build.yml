name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Rosemary Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential curl flex git gnupg gperf \
            liblz4-tool libncurses5-dev libssl-dev lzop \
            squashfs-tools zip zlib1g-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
            
      - name: Download Proton Clang
        run: |
          mkdir -p $HOME/compiler
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $HOME/compiler/clang

      - name: Refresh ReSukiSu
        run: |
          # stupid
          rm -rf KernelSU drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/ReSukiSu/ReSukiSU/main/kernel/setup.sh" | bash
          
      - name: build
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image-dtb-rosemary
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/mediatek/mt6785.dtb
            out/arch/arm64/boot/dts/mediatek/rosemary.dtbo
          if-no-files-found: error
